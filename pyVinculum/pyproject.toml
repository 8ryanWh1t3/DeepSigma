[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinculum-pylib"
version = "0.4.0"
description = "A deterministic bounded-coherence kernel with root-signed governance, durable trust, and authoritative COMPOSER-to-CERPA choke-point integration."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Deep Sigma"}]
keywords = ["vinculum", "bounded-coherence", "decision-support", "provenance", "constraints"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = ["cryptography>=43"]

[project.scripts]
vinculum = "vinculum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
