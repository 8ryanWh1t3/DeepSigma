[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinculum-pylib"
version = "0.5.2"
description = "VINCULUM P↔D Tension Engine with second-order semantic strength and probabilistic math-defense modeling across claims, episodes, documents, math, data, and RDF/Turtle."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Deep Sigma"}]
keywords = ["vinculum", "probabilistic", "deterministic", "tension", "bounded-coherence", "rdf", "turtle", "semantic-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = ["rdflib>=7.0"]

[project.scripts]
vinculum = "vinculum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
