[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsigma-contrast"
version = "0.1.0"
description = "Deterministic contrastive-learning primitives for Deep Sigma institutional judgment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Deep Sigma"}]
keywords = ["contrastive-learning", "institutional-memory", "decision-intelligence", "deep-sigma"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deepsigma-contrast = "deepsigma_contrast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
