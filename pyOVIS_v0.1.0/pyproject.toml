[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyovis"
version = "0.1.0"
description = "Deep Sigma multimodal semantic discovery layer for Ovis embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Deep Sigma"}]
keywords = ["multimodal", "embeddings", "ovis", "semantic-search", "retrieval", "deep-sigma"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "pypdf>=5,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ovis = [
  "torch>=2.4",
  "transformers>=5.16,<6",
  "accelerate>=0.33",
  "qwen-omni-utils",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]

[project.scripts]
pyovis = "pyovis.cli:app"

[project.urls]
Homepage = "https://github.com/YOUR-ORG/pyOVIS"
Repository = "https://github.com/YOUR-ORG/pyOVIS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
