[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinculum-pylib"
version = "0.7.0"
description = "Input-runtime-output pipeline, bounded ingestion, ontology and pairing; cross-order language–mathematics pairing, hinge evaluation, uncertainty and codec preservation; legacy v0.5.2 API retained."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Deep Sigma"}]
keywords = ["vinculum", "probabilistic", "deterministic", "tension", "bounded-coherence", "rdf", "turtle", "semantic-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = ["rdflib>=7.0"]

[project.scripts]
vinculum = "vinculum.cli:main"
vinculum-lattice = "vinculum.lattice_cli:main"
vinculum-pipeline = "vinculum.pipeline_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vinculum = ["py.typed"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]
documents = ["pypdf>=5", "python-docx>=1.1"]
config = ["PyYAML>=6"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
pdf = ["reportlab>=4"]
parquet = ["pyarrow>=18"]
