<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP Action Doctrine Runtime — Canvas Mode v0.9.0 RC38</title>
<style>
/* ===== Design tokens — weighted blend of Apple HIG / Material / Fluent ===== */
:root{
  --bg:#0B1220; --bg2:#0E1626; --panel:#111B2E; --panel2:#16223A;
  --line:#1F2D45; --line2:#27395A; --ink:#E8EEF8; --ink2:#A9B7CE; --ink3:#6F8099;
  --signal:#4ADE80; --signaldim:#1d6b3f;
  --blue:#3B82F6; --cyan:#22D3EE; --purple:#A855F7; --violet:#EC4899;
  --amber:#FBBF24; --red:#F87171; --slate:#94A3B8; --green:#34D399; --lime:#A3E635;
  --shadow:0 8px 28px rgba(0,0,0,.45); --shadow2:0 2px 10px rgba(0,0,0,.35);
  --r:14px; --r2:10px; --r3:7px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono","Roboto Mono","Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;font-size:13px;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ===== App shell ===== */
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}

/* ===== Top command bar ===== */
#topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--line);box-shadow:var(--shadow2);z-index:40;position:relative}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#1c3a2a,#0c1a12);
  border:1px solid var(--signaldim);color:var(--signal);font-weight:800;font-size:15px}
.brand .t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand .t .n{font-weight:650;font-size:13px;letter-spacing:.2px;white-space:nowrap}
.brand .t .v{font-size:13px;color:var(--ink3);font-family:var(--mono)}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.cmdwrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--line2);border-radius:999px;padding:6px 12px;min-width:120px;max-width:560px}
.cmdwrap:focus-within{border-color:var(--signaldim);box-shadow:0 0 0 3px rgba(74,222,128,.08)}
.cmdwrap .pmt{color:var(--signal);font-family:var(--mono);font-size:13px;user-select:none}
#cmd{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:13px;font-family:var(--mono)}
#cmd::placeholder{color:var(--ink3)}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink2);
  border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:13px;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s}
.tbtn:hover{background:var(--panel2);color:var(--ink);border-color:var(--line2)}
.tbtn.prim{background:linear-gradient(180deg,#173524,#0f2418);color:var(--signal);border-color:var(--signaldim)}
.tbtn.prim:hover{background:#1a3d2a}
.tbtn .g{font-size:14px;line-height:1}
.searchwrap{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);
  border-radius:999px;padding:5px 11px;width:170px}
.searchwrap input{background:transparent;border:0;outline:0;color:var(--ink);font-size:13px;width:100%}

/* mic chip */
#micChip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);
  border-radius:999px;padding:5px 11px 5px 9px;cursor:pointer;user-select:none}
#micDot{width:9px;height:9px;border-radius:50%;background:var(--ink3);transition:background .2s,box-shadow .2s}
#micChip.on #micDot{background:var(--signal);box-shadow:0 0 0 4px rgba(74,222,128,.18)}
#micChip.denied #micDot{background:var(--red)}
#micChip .lbl{font-size:13px;color:var(--ink2)}
.meter{display:flex;align-items:flex-end;gap:2px;height:14px;width:30px}
.meter i{flex:1;background:var(--line2);border-radius:1px;height:20%;transition:height .08s}
#micChip.on .meter i{background:var(--signal)}

/* ===== Workspace ===== */
#work{position:relative;overflow:hidden}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:default;
  background:
    radial-gradient(1200px 700px at 70% -10%,rgba(74,222,128,.05),transparent 60%),
    radial-gradient(900px 600px at 10% 110%,rgba(96,165,250,.05),transparent 60%),
    var(--bg)}
#viewport.panning{cursor:grabbing}
#viewport.connecting{cursor:crosshair}
.grid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#linksvg{position:absolute;left:0;top:0;width:14000px;height:11000px;overflow:visible;pointer-events:none}
#linksvg path.hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}
#linksvg path.wire{fill:none;pointer-events:none}
#linksvg path.wire.sel{filter:drop-shadow(0 0 6px currentColor)}
#linksvg .lbl rect{fill:var(--panel2);stroke:var(--line2);stroke-width:1}
#linksvg .lbl text{font-family:var(--mono);font-size:13px;fill:var(--ink2)}
#tempwire{stroke:var(--signal);stroke-width:2;stroke-dasharray:6 5;fill:none;pointer-events:none;opacity:.9}

/* ===== Object cards ===== */
.card{position:absolute;width:248px;background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1.5px solid var(--line2);border-radius:var(--r2);box-shadow:var(--shadow);
  padding:0;user-select:none;transition:box-shadow .12s,transform .04s;overflow:visible}
.card:hover{box-shadow:0 12px 34px rgba(0,0,0,.55)}
.card.sel{box-shadow:0 0 0 2px var(--signal),0 14px 40px rgba(0,0,0,.6)}
.card .acc{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r2) 0 0 var(--r2);background:var(--slate)}
.card.bd-dotted{border-style:dotted}
.card.bd-dashed{border-style:dashed}
.card.bd-double{border-style:double;border-width:3px}
.card.glow{box-shadow:0 0 0 1px var(--purple),0 0 22px rgba(167,139,250,.35),var(--shadow)}
.card.glow.sel{box-shadow:0 0 0 2px var(--signal),0 0 22px rgba(167,139,250,.35)}
.card .hd{display:flex;align-items:center;gap:7px;padding:9px 11px 6px 14px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:13px;font-weight:600;letter-spacing:.2px;background:rgba(255,255,255,.04);border:1px solid var(--line2)}
.badge .gly{font-size:13px;line-height:1}
.card .titl{padding:0 11px 4px 14px;font-weight:650;font-size:13.5px;line-height:1.25}
.card .sum{padding:0 11px 9px 14px;font-size:13px;color:var(--ink2);line-height:1.4;max-height:84px;overflow:hidden}
.card.collapsed .sum{display:none}
.card .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 11px 9px 14px;border-top:1px solid var(--line);
  background:rgba(0,0,0,.14);border-radius:0 0 var(--r2) var(--r2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:1px 7px;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--ink2)}
.chip.sealed{color:var(--purple);border-color:#3a2f63}
.chip.patched{color:var(--green);border-color:#1f5a44}
.chip.drift{color:var(--amber);border-color:#5a4612}
.chip.urgent{color:var(--red);border-color:#5a2222}
.chip.sev-high{color:var(--red);border-color:#5a2222}
.chip.sev-med{color:var(--amber);border-color:#5a4612}
.chip.conf{font-family:var(--mono)}
.chip.links{font-family:var(--mono)}
mark{border-radius:3px;padding:0 2px;color:inherit}
mark.hl-search{background:rgba(251,191,36,.32)}
mark.hl-warn{background:rgba(251,191,36,.22);box-shadow:inset 0 -1px 0 var(--amber)}
mark.hl-contra{background:rgba(248,113,113,.22);box-shadow:inset 0 -1px 0 var(--red)}
mark.hl-valid{background:rgba(52,211,153,.20);box-shadow:inset 0 -1px 0 var(--green)}
mark.hl-doctrine{background:rgba(167,139,250,.22);box-shadow:inset 0 -1px 0 var(--purple)}
/* connection handles */
.handle{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--bg2);
  border:2px solid var(--signal);opacity:0;transition:opacity .12s,transform .12s;cursor:crosshair;z-index:5}
.card:hover .handle,.card.sel .handle{opacity:.85}
.handle:hover{opacity:1;transform:scale(1.35);box-shadow:0 0 10px rgba(74,222,128,.6)}
.handle.h-r{right:-7px;top:calc(50% - 7px)}
.handle.h-l{left:-7px;top:calc(50% - 7px)}
.handle.h-t{top:-7px;left:calc(50% - 7px)}
.handle.h-b{bottom:-7px;left:calc(50% - 7px)}
.pin{position:absolute;right:8px;top:8px;font-size:13px;color:var(--amber);display:none}
.card.pinned .pin{display:block}

/* ===== Inspector ===== */
#inspector{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;z-index:160;
  background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:0 24px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;
  transition:transform .18s ease,opacity .18s}
#inspector.hidden{transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none}
#inspectorScrim{position:fixed;inset:0;background:rgba(2,6,16,.55);z-index:155;opacity:0;pointer-events:none;transition:opacity .18s}
#inspectorScrim.show{opacity:1;pointer-events:auto}
.insp-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--line)}
.insp-hd .ttl{font-weight:650;font-size:13px;display:flex;align-items:center;gap:8px}
.insp-hd .x{background:transparent;border:0;color:var(--ink3);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.insp-hd .x:hover{background:var(--panel2);color:var(--ink)}
.insp-body{padding:13px;overflow:auto;flex:1}
.insp-empty{display:grid;place-items:center;height:100%;color:var(--ink3);text-align:center;padding:24px;gap:8px}
.fld{margin-bottom:11px}
.fld .k{font-size:13px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:600}
.fld .val{font-size:13px;color:var(--ink);word-break:break-word}
.fld .val.mono{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.linklist{display:flex;flex-direction:column;gap:5px}
.linkrow{display:flex;align-items:center;gap:7px;font-size:13px;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:6px 8px;cursor:pointer}
.linkrow:hover{border-color:var(--line2)}
.linkrow .rel{font-family:var(--mono);color:var(--signal);font-size:13px}
.linkrow .dir{color:var(--ink3)}
.insp-actions{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px;border-top:1px solid var(--line);background:rgba(0,0,0,.18)}
.act{background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:13px;flex:1 0 auto}
.act:hover{background:#1a2740;color:var(--ink)}
.act.danger{color:var(--red);border-color:#4a2222}
.act.go{color:var(--signal);border-color:var(--signaldim)}

/* ===== Voice HUD ===== */
#voiceHud{position:absolute;left:12px;bottom:12px;max-width:480px;z-index:25;
  background:rgba(14,22,38,.92);border:1px solid var(--line2);border-radius:12px;
  padding:9px 13px;box-shadow:var(--shadow);backdrop-filter:blur(8px);display:none}
#voiceHud.show{display:block}
#voiceHud .row{display:flex;align-items:center;gap:9px;font-size:13px}
#voiceHud .tr{color:var(--ink);font-style:italic}
#voiceHud .st{font-family:var(--mono);font-size:13px}
.st.ok{color:var(--signal)} .st.warn{color:var(--amber)} .st.err{color:var(--red)} .st.idle{color:var(--ink3)}

/* ===== Zoom dock + minimap ===== */
#dock{position:absolute;left:12px;top:12px;z-index:25;display:flex;flex-direction:column;gap:5px;
  background:rgba(14,22,38,.85);border:1px solid var(--line2);border-radius:11px;padding:5px;backdrop-filter:blur(6px)}
#dock button{width:34px;height:34px;display:grid;place-items:center;background:transparent;border:0;color:var(--ink2);
  border-radius:8px;font-size:16px}
#dock button:hover{background:var(--panel2);color:var(--ink)}
#dock button.ztext{width:auto;min-width:34px;padding:0 11px;font-size:13px;font-weight:600;letter-spacing:.02em}
#dock button.active{background:var(--panel2);color:var(--signal)}
#dock #zmap{font-size:13px;font-weight:700;letter-spacing:.02em}
#dock .zlvl{font-size:13px;text-align:center;color:var(--ink3);font-family:var(--mono);padding:1px 0}
#minimap{position:absolute;right:352px;bottom:12px;width:172px;height:140px;z-index:24;display:none;
  background:rgba(11,18,32,.9);border:1px solid var(--line2);border-radius:9px;overflow:hidden;box-shadow:var(--shadow2)}
#minimap.show{display:block}
#minimap .mmhd{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--ink3);
  padding:4px 8px;border-bottom:1px solid var(--line);background:rgba(14,22,38,.7)}
#minimap canvas{display:block;width:100%;height:calc(100% - 25px)}

/* ===== Sigma Voice Dock (v0.7.19 pattern) ===== */
#sigmaVoiceDock{position:relative;z-index:140;background:#0e1626;border-bottom:1px solid #22304a;box-shadow:0 6px 24px rgba(0,0,0,.4);display:flex;flex-direction:column}
.sv-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;min-height:42px}
.sv-toggle{flex:0 0 auto;width:42px;height:30px;border-radius:9px;border:1px solid #25324c;background:#10192b;color:#9fb0c9;font-size:15px;cursor:pointer;line-height:1;transition:all .15s}
.sv-toggle:hover{background:#16223a;color:#cdd8ea}
.sv-toggle.listening{border-color:#4ADE80;background:#173524;color:#bdf3cf;box-shadow:0 0 0 3px rgba(74,222,128,.18);animation:svpulse 1.4s ease-in-out infinite}
.sv-toggle[data-st="Mic Blocked"],.sv-toggle[data-st="Blocked"],.sv-toggle[data-st="Speech Unavailable"]{border-color:#f87171;color:#ffd2d2;background:#2a0f0f}
.sv-stream{flex:1 1 0;min-width:60px;display:flex;align-items:center;gap:8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.sv-stream::-webkit-scrollbar{height:5px}.sv-stream::-webkit-scrollbar-thumb{background:#22304a;border-radius:3px}
.sv-stream .sv-resp{flex:0 1 auto;min-width:0;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;border:0;padding:0;background:none}
.sv-bar .sv-title{flex:0 0 auto}
.sv-say{flex:1 1 auto;min-width:140px;display:flex;align-items:center}
.sv-say .cmdwrap{flex:1;margin:0}
.sv-io{display:flex;align-items:center;gap:16px;padding:4px 12px 7px;min-width:0;border-top:1px solid #16223a}
.sv-io .sv-said,.sv-io .sv-resp{flex:1 1 0;min-width:0;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:1.35}
.sv-bar-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
.sv-bar .sv-ptt{margin-top:0;width:auto;padding:7px 13px;font-size:13px;white-space:nowrap}
.sv-drop{display:flex;flex-direction:column;padding:0 12px}
.sv-drop>*{margin:0}
.sv-drop>#sigmaChoices,.sv-drop>#sigmaHints,.sv-drop>.sv-pending,.sv-drop>.sv-cap{margin-top:8px}
.sv-drop>#sigmaChoices,.sv-drop>#sigmaHints,.sv-drop>.sv-pending{background:#0b1322;border:1px solid #22304a;border-radius:12px;padding:9px 11px}
.sv-drop>#sigmaChoices{flex-wrap:wrap}
.sv-drop>#sigmaHints{border-top:1px solid #22304a}
.sv-settings{position:absolute;top:100%;right:12px;width:300px;max-height:74vh;overflow:auto;background:#0e1626;border:1px solid #22304a;border-radius:0 0 14px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:12px;z-index:142}
.sv-set-hd{font-weight:700;font-size:13px;color:#e6edf6;margin-bottom:6px}
.sv-ic.on{background:#173524;color:#4ADE80;border-color:#2e7d4f}
.sv-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0b1322;border-bottom:1px solid #1b2740}
.sv-title{font-weight:700;font-size:14px;color:#e6edf6;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sv-badge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid #2a3a57;color:#9fb0c9;background:#172339;white-space:nowrap}
.sv-badge[data-st="Listening"]{color:#06210f;background:#4ADE80;border-color:#4ADE80;animation:svpulse 1.4s ease-in-out infinite}
.sv-badge[data-st="Starting"]{color:#231a02;background:#facc15;border-color:#facc15}
.sv-badge[data-st="Processing"]{color:#231a02;background:#facc15;border-color:#facc15}
.sv-badge[data-st="Confirming"]{color:#04122c;background:#60a5fa;border-color:#60a5fa}
.sv-badge[data-st="Blocked"]{color:#2a0707;background:#f87171;border-color:#f87171}
.sv-badge[data-st="Mic Blocked"]{color:#2a0707;background:#f87171;border-color:#f87171}
.sv-badge[data-st="Speech Unavailable"]{color:#2a1a02;background:#fb923c;border-color:#fb923c}
@keyframes svpulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}50%{box-shadow:0 0 0 5px rgba(74,222,128,0)}}
.sv-icons{margin-left:auto;display:flex;gap:5px}
.sv-ic{width:26px;height:26px;border-radius:8px;border:1px solid #25324c;background:#10192b;color:#cdd8ea;font-size:13px;cursor:pointer;line-height:1}
.sv-ic:hover{background:#16223a}
.sv-body{padding:12px;overflow-y:auto;min-height:0}
.sv-stage{background:#0a1120;border:1px solid #1b2740;border-radius:12px;padding:10px}
#sigmaWave{display:block;width:120px;height:26px;background:#0a1120;border:1px solid #1b2740;border-radius:6px;flex:0 0 auto}
.sv-said{margin-top:9px;font-size:13px;color:#e6edf6;line-height:1.4;word-break:break-word}
.sv-said b{color:#8aa0c0;font-weight:600}
.sv-resp{margin-top:5px;font-size:13px;color:#9fb0c9;line-height:1.4;word-break:break-word}
.sv-sig{color:#4ADE80;font-weight:700}
.sv-muted{color:#6b7689}
.sv-pending{display:flex;gap:8px;margin-top:9px}
#sigmaChoices{display:none;align-items:center;flex-wrap:nowrap;gap:6px;margin:0}
.sv-choice{background:#13233b;border:1px solid #2a3a57;color:#cfe0f5;font-size:13px;padding:5px 10px;border-radius:8px;cursor:pointer;line-height:1.2}
.sv-choice:hover{background:#1a3050;border-color:#4ADE80;color:#bdf3cf}
#sigmaHints{margin:0;font-size:13px;color:#7d8aa0;display:flex;align-items:center;gap:0;white-space:nowrap}
#sigmaHints:empty{display:none}
.card.sigma-hit{outline:2px solid var(--signal);outline-offset:2px;box-shadow:0 0 0 3px rgba(74,222,128,.22),0 0 26px rgba(74,222,128,.40)!important;animation:sigHit 1.2s ease-in-out 2}
@keyframes sigHit{0%,100%{box-shadow:0 0 0 3px rgba(74,222,128,.22),0 0 26px rgba(74,222,128,.40)}50%{box-shadow:0 0 0 5px rgba(74,222,128,.10),0 0 34px rgba(74,222,128,.20)}}
.dt-title{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 10px}
.dt-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-bottom:4px}
.dt-grid .dt-k{color:var(--ink3);font-weight:600;white-space:nowrap}
.dt-grid .dt-v{color:var(--ink)}
.dt-sec{margin-top:11px}
.dt-sec>.dt-k{color:var(--signal);font-weight:700;font-size:13px;margin-bottom:3px}
.dt-sec>.dt-v{font-size:13px;color:var(--ink2);line-height:1.6}
.dt-rels{margin:4px 0 0;padding:0;list-style:none;font-size:13px}
.dt-rels li{padding:2px 0;color:var(--ink2)}
.dt-rel{color:var(--signal);font-family:var(--mono)}
.dt-muted{color:var(--ink3);font-size:13px}
.sv-hint-k{color:#4ADE80;font-weight:700;margin-right:5px;letter-spacing:.02em}

.sv-ptt{margin-top:11px;width:100%;padding:9px 12px;border-radius:10px;border:1px solid #2e7d4f;

.sv-ptt:hover{background:#163a22}

.sv-rec.armed{border-color:#f87171;color:#ffd2d2;background:#2a0f0f}
.sv-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
.sv-link{background:none;border:none;color:#8aa0c0;font-size:13px;cursor:pointer;padding:0}
.sv-link:hover{color:#cdd8ea}

#scrim{position:fixed;inset:0;background:rgba(5,9,18,.55);backdrop-filter:blur(2px);z-index:165;display:none}
#scrim.show{display:block}
.modal{position:fixed;z-index:170;left:50%;top:50%;transform:translate(-50%,-50%);

.frow input,.frow select,.frow textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--ink);

.frow .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink2);border-radius:9px;padding:9px 15px;font-size:13px}

  border-radius:7px;padding:8px 11px;margin-top:4px}

/* toast */

  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:10px 16px;border-radius:11px;
  box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80vw}

<script>
"use strict";
/* =====================================================================
   MP Action Doctrine Runtime — Canvas Mode v0.9.0 RC38
   Single-file offline EDGE app. Zero external dependencies.
   AUTONOMY WALL: this surface lets humans create / authorize / apply.
   Nothing here autonomously commits truth, seals records, or targets.
   Seed scenario is SYNTHETIC / ILLUSTRATIVE.
   ===================================================================== */
const VERSION = "0.9.0";
const RC      = "RC38";
const LS_KEY  = "mp_action_doctrine_canvas_v0_9_0";
const LS_KEY_PRIOR = "mp_action_doctrine_canvas_v0_8_6";  // migrate forward, no data loss on lockstep bump
let sigmaSavedCanvas=null, sigmaStartupOffer=false, sigmaHoldSave=false;   // non-destructive startup: keep prior saved canvas, offer to open it (hold persistence until the operator acts)

/* ---- type & relationship metadata ---- */
const TYPES = {
  "Claim":       {accent:"var(--blue)",   gly:"◆", group:"intel"},
  "Event":       {accent:"var(--slate)",  gly:"●"},
  "Decision":    {accent:"var(--cyan)",   gly:"▷"},
  "Action":      {accent:"var(--signal)", gly:"►"},
  "Assumption":  {accent:"var(--amber)",  gly:"◇"},
  "Risk":        {accent:"var(--red)",    gly:"▲"},
  "Evidence":    {accent:"var(--blue)",   gly:"▣"},
  "Doctrine":    {accent:"var(--purple)", gly:"§"},
  "Patch":       {accent:"var(--lime)",  gly:"✚"},
  "Reflection":  {accent:"var(--violet)", gly:"◈"},
  "DLR":         {accent:"var(--cyan)",   gly:"⛓"},
  "Drift Signal":{accent:"var(--amber)",  gly:"〜"},
  "Memory Node": {accent:"var(--purple)", gly:"⬡"}
};
const TYPE_LIST = Object.keys(TYPES);
const REL_TYPES = ["supports","contradicts","causes","depends_on","informs","triggers","patches",
  "supersedes","evidences","reviews","produces","assigned_to","governed_by","related_to","blocks","enables","mitigates"];
const REL_STYLE = {
  supports:{c:"#4ADE80",l:"solid"}, mitigates:{c:"#4ADE80",l:"solid"}, enables:{c:"#4ADE80",l:"dotted"},
  contradicts:{c:"#F87171",l:"solid",t:3}, blocks:{c:"#F87171",l:"solid"},
  causes:{c:"#FBBF24",l:"solid"}, depends_on:{c:"#FBBF24",l:"dashed"},
  evidences:{c:"#60A5FA",l:"solid"}, informs:{c:"#60A5FA",l:"dotted"},
  governed_by:{c:"#A78BFA",l:"solid"}, reviews:{c:"#A78BFA",l:"dashed"}, supersedes:{c:"#A78BFA",l:"solid"},
  patches:{c:"#A3E635",l:"solid"},
  triggers:{c:"#22D3EE",l:"solid"}, produces:{c:"#22D3EE",l:"solid"},
  assigned_to:{c:"#94A3B8",l:"solid"}, related_to:{c:"#94A3B8",l:"dotted"}
};
const HL_KINDS = {search:"hl-search",warn:"hl-warn",contradiction:"hl-contra",validated:"hl-valid",doctrine:"hl-doctrine"};

/* ---- utilities ---- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const now = ()=> new Date().toISOString();
function uid(p){ return p+"-"+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function cssVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v.replace(/var\((.+)\)/,"$1").trim())||v; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

/* ---- state ---- */
let state = null;
function blankState(){
  return { version:VERSION, mode:"Canvas", objects:[], links:[],
    viewport:{x:80,y:60,zoom:1}, selectedObjectId:null, selectedLinkId:null,
    voice:{enabled:false,wakeMode:"optional",speak:true,ttsVoiceName:"Google UK English Female",recogLang:"",style:"direct",spokenPersonality:false,speechDebug:false,lastTranscript:"",lastCommandStatus:""}, history:[] };
}
function save(){ if(sigmaHoldSave) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ toast("Save failed: "+e.message,"err"); } }
function load(){
  try{
    let s=localStorage.getItem(LS_KEY);
    if(!s){ s=localStorage.getItem(LS_KEY_PRIOR); }  // one-time forward migration from v0.8.6 key
    if(s){ const o=JSON.parse(s); if(o&&o.objects){
      o.voice=o.voice||{}; if(!o.voice.wakeMode) o.voice.wakeMode="optional"; o.voice.speak=true; if(o.voice.speechDebug===undefined) o.voice.speechDebug=false;   // audio responses ALWAYS ON (forced every load)
      if(o.voice.ttsVoiceName===undefined) o.voice.ttsVoiceName="Google UK English Female";   // default UK female (falls back if absent)
      if(o.voice.recogLang===undefined) o.voice.recogLang="";                                   // recognition follows the operator environment (auto)
      if(o.voice.style===undefined) o.voice.style="direct";                                     // Sigma text style: direct (default) or okboss
      if(o.voice.spokenPersonality===undefined) o.voice.spokenPersonality=false;                // spoken replies stay direct unless explicitly enabled
      return o;
    } }
  }catch(e){} return null;
}

/* ---- viewport transform ---- */
let pan={x:80,y:60}, zoom=1;
const worldEl=$("#world"), vpEl=$("#viewport");
function applyTransform(){
  worldEl.style.transform = "translate("+pan.x+"px,"+pan.y+"px) scale("+zoom+")";
  $("#zlvl").textContent = Math.round(zoom*100)+"%";
  state.viewport={x:pan.x,y:pan.y,zoom:zoom};
  drawMinimap();
}
function screenToWorld(cx,cy){ const r=vpEl.getBoundingClientRect(); return {x:(cx-r.left-pan.x)/zoom,y:(cy-r.top-pan.y)/zoom}; }
function zoomAt(cx,cy,factor){
  const r=vpEl.getBoundingClientRect();
  const wx=(cx-r.left-pan.x)/zoom, wy=(cy-r.top-pan.y)/zoom;
  zoom=clamp(zoom*factor,0.25,2.4);
  pan.x=cx-r.left-wx*zoom; pan.y=cy-r.top-wy*zoom;
  applyTransform();
}

/* ---- object / link accessors ---- */
const obj = id=> state.objects.find(o=>o.id===id);
const lnk = id=> state.links.find(l=>l.id===id);
function findByTitle(q){
  q=(q||"").trim().toLowerCase(); if(!q) return null;
  const O=state.objects;
  let m=O.find(o=>(o.title||"").toLowerCase()===q);            if(m) return m;   // 1) exact title
  m=O.find(o=>(o.title||"").toLowerCase().startsWith(q));      if(m) return m;   // 2) title prefix
  m=O.find(o=>(o.title||"").toLowerCase().includes(q));        if(m) return m;   // 3) title contains
  // 4) broaden: any text inside the object (read live, so edits are picked up on refresh)
  const hay=o=>[o.title,o.summary,o.body,o.owner,o.type,(o.tags||[]).join(" ")].join(" \u2022 ").toLowerCase();
  m=O.find(o=>hay(o).includes(q));                             if(m) return m;
  // 5) multi-word: every query word appears somewhere in the object
  const qt=q.split(/\s+/).filter(Boolean);
  if(qt.length>1){ m=O.find(o=>{ const h=hay(o); return qt.every(t=>h.includes(t)); }); if(m) return m; }
  return null;
}

/* =====================================================================
   RENDER — cards
   ===================================================================== */
const cardEls = new Map();
function newObject(o){
  const base = {
    id:uid("OBJ"), type:"Claim", title:"Untitled", summary:"", body:"", status:"normal",
    confidence:null, severity:null, owner:"", tags:[], x:400, y:300, width:248, height:0,
    sealed:false, patched:false, createdAt:now(), updatedAt:now(),
    visual:{borderStyle:"solid",accentColor:null,highlightRanges:[],pinned:false,collapsed:false},
    metadata:{}
  };
  return Object.assign(base,o);
}
function borderClass(o){
  const bs=o.visual.borderStyle||"solid"; let c="";
  if(o.sealed) c="bd-double glow";
  else if(bs==="dotted") c="bd-dotted";
  else if(bs==="dashed") c="bd-dashed";
  else if(bs==="double") c="bd-double";
  return c;
}
function accentOf(o){ return o.visual.accentColor || (TYPES[o.type]?TYPES[o.type].accent:"var(--slate)"); }
function applyHighlights(text,ranges){
  let html=esc(text);
  (ranges||[]).forEach(r=>{
    if(!r||!r.text) return;
    const cls=HL_KINDS[r.kind]||"hl-search";
    const safe=esc(r.text).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    html=html.replace(new RegExp(safe), m=>'<mark class="'+cls+'">'+m+'</mark>');
  });
  return html;
}
function cardHTML(o){
  const tm=TYPES[o.type]||{gly:"●"};
  const acc=accentOf(o);
  const chips=[];
  if(o.sealed)   chips.push('<span class="chip sealed">⛨ sealed</span>');
  if(o.patched)  chips.push('<span class="chip patched">✚ patched</span>');
  if(o.type==="Drift Signal"||o.status==="drift") chips.push('<span class="chip drift">〜 drift</span>');
  if(o.status==="urgent") chips.push('<span class="chip urgent">! urgent</span>');
  if(o.severity==="high") chips.push('<span class="chip sev-high">▲ high</span>');
  else if(o.severity==="med") chips.push('<span class="chip sev-med">▲ med</span>');
  if(o.confidence!=null) chips.push('<span class="chip conf">'+Math.round(o.confidence*100)+'%</span>');
  const lc=state.links.filter(l=>l.sourceId===o.id||l.targetId===o.id).length;
  if(lc) chips.push('<span class="chip links">⛓ '+lc+'</span>');
  if(o.owner) chips.push('<span class="chip">'+esc(o.owner)+'</span>');
  return ''+
    '<span class="acc" style="background:'+acc+'"></span>'+
    '<span class="pin">📌</span>'+
    '<div class="hd"><span class="badge" style="color:'+acc+'"><span class="gly">'+tm.gly+'</span>'+esc(o.type)+'</span></div>'+
    '<div class="titl">'+applyHighlights(o.title,o.visual.highlightRanges)+'</div>'+
    (o.summary?'<div class="sum">'+applyHighlights(o.summary,o.visual.highlightRanges)+'</div>':'')+
    (chips.length?'<div class="ft">'+chips.join('')+'</div>':'')+
    '<div class="handle h-r" data-h="r"></div><div class="handle h-l" data-h="l"></div>'+
    '<div class="handle h-t" data-h="t"></div><div class="handle h-b" data-h="b"></div>';
}
function makeCardEl(o){
  const el=document.createElement("div");
  el.className="card";
  el.dataset.id=o.id;
  el.style.left=o.x+"px"; el.style.top=o.y+"px"; el.style.width=(o.width||248)+"px";
  el.innerHTML=cardHTML(o);
  worldEl.appendChild(el);
  cardEls.set(o.id,el);
  return el;
}
function refreshCard(o){
  let el=cardEls.get(o.id);
  if(!el){ el=makeCardEl(o); }
  el.innerHTML=cardHTML(o);
  el.style.left=o.x+"px"; el.style.top=o.y+"px"; el.style.width=(o.width||248)+"px";
  el.className="card "+borderClass(o)+(o.visual.pinned?" pinned":"")+(o.visual.collapsed?" collapsed":"")+(state.selectedObjectId===o.id?" sel":"")+((typeof sigmaHitIds!=="undefined"&&sigmaHitIds.has(o.id))?" sigma-hit":"");
  el.style.display=(typeof sigmaFocusIds!=="undefined"&&sigmaFocusIds&&!sigmaFocusIds.has(o.id))?"none":"";   // focus filter hides everything else
  // measure height for link anchoring
  o.height=el.offsetHeight;
}
function renderCards(){
  // remove stale
  for(const [id,el] of cardEls){ if(!obj(id)){ el.remove(); cardEls.delete(id); } }
  state.objects.forEach(refreshCard);
}

/* =====================================================================
   RENDER — links
   ===================================================================== */
const svg=$("#linksvg"), linksG=$("#linksG"), defs=$("#svgdefs");
function ensureMarker(color,key){
  const id="arw-"+key;
  if(defs.querySelector("#"+id)) return id;
  const m=document.createElementNS("http://www.w3.org/2000/svg","marker");
  m.setAttribute("id",id); m.setAttribute("viewBox","0 0 10 10");
  m.setAttribute("refX","9"); m.setAttribute("refY","5");
  m.setAttribute("markerWidth","7"); m.setAttribute("markerHeight","7"); m.setAttribute("orient","auto-start-reverse");
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M0,0 L10,5 L0,10 z"); p.setAttribute("fill",color);
  m.appendChild(p); defs.appendChild(m); return id;
}
function center(o){ return {x:o.x+(o.width||248)/2, y:o.y+(o.height||90)/2}; }
function edgePoint(a,b){ // point on a's box edge toward b
  const w=(a.width||248)/2, h=(a.height||90)/2, c=center(a), t=center(b);
  let dx=t.x-c.x, dy=t.y-c.y; if(dx===0&&dy===0) return c;
  const sx=dx?w/Math.abs(dx):Infinity, sy=dy?h/Math.abs(dy):Infinity;
  const s=Math.min(sx,sy);
  return {x:c.x+dx*s, y:c.y+dy*s};
}
function linkColor(l){ return (l.style&&l.style.color) || (REL_STYLE[l.type]&&REL_STYLE[l.type].c) || "#94A3B8"; }
function linkDash(l){
  const ls=(l.style&&l.style.lineStyle) || (REL_STYLE[l.type]&&REL_STYLE[l.type].l) || "solid";
  if(ls==="dotted") return "2 6"; if(ls==="dashed") return "8 6"; return "";
}
function linkWidth(l){ return (l.style&&l.style.thickness) || (REL_STYLE[l.type]&&REL_STYLE[l.type].t) || 1.8; }
function renderLinks(){
  linksG.innerHTML="";
  state.links.forEach(l=>{
    const a=obj(l.sourceId), b=obj(l.targetId); if(!a||!b) return;
    if(typeof sigmaFocusIds!=="undefined"&&sigmaFocusIds&&(!sigmaFocusIds.has(a.id)||!sigmaFocusIds.has(b.id))) return;   // focus filter
    const p1=edgePoint(a,b), p2=edgePoint(b,a);
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const col=linkColor(l), key=col.replace(/[^a-z0-9]/gi,"");
    const sel=state.selectedLinkId===l.id;
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.style.color=col;
    // curve slightly
    const dx=p2.x-p1.x, dy=p2.y-p1.y, off=Math.min(40,Math.hypot(dx,dy)*0.12);
    const cx=mx - dy/ (Math.hypot(dx,dy)||1) *off, cy=my + dx/(Math.hypot(dx,dy)||1)*off;
    const d="M"+p1.x+","+p1.y+" Q"+cx+","+cy+" "+p2.x+","+p2.y;
    const hit=document.createElementNS("http://www.w3.org/2000/svg","path");
    hit.setAttribute("class","hit"); hit.setAttribute("d",d); hit.dataset.id=l.id;
    const wire=document.createElementNS("http://www.w3.org/2000/svg","path");
    wire.setAttribute("class","wire"+(sel?" sel":"")); wire.setAttribute("d",d);
    wire.setAttribute("stroke",col); wire.setAttribute("stroke-width",(sel?linkWidth(l)+1.2:linkWidth(l)));
    const dash=linkDash(l); if(dash) wire.setAttribute("stroke-dasharray",dash);
    if(l.style&&l.style.arrow!==false){ const mk=ensureMarker(col,key); wire.setAttribute("marker-end","url(#"+mk+")"); }
    if(l.direction==="bidirectional"&&l.style&&l.style.arrow!==false){ const mk=ensureMarker(col,key); wire.setAttribute("marker-start","url(#"+mk+")"); }
    g.appendChild(hit); g.appendChild(wire);
    const lbltext=l.label||l.type;
    if(lbltext){
      const lg=document.createElementNS("http://www.w3.org/2000/svg","g"); lg.setAttribute("class","lbl");
      const tw=lbltext.length*7+12;
      const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x",mx-tw/2); rect.setAttribute("y",my-10); rect.setAttribute("width",tw); rect.setAttribute("height",19);
      rect.setAttribute("rx","5");
      const txt=document.createElementNS("http://www.w3.org/2000/svg","text");
      txt.setAttribute("x",mx); txt.setAttribute("y",my+4); txt.setAttribute("text-anchor","middle");
      txt.setAttribute("fill",col); txt.textContent=lbltext;
      lg.appendChild(rect); lg.appendChild(txt); g.appendChild(lg);
    }
    linksG.appendChild(g);
  });
}

  if(!others.length){ toast("No other object to link to","warn"); return; }

/* =====================================================================
   CANVAS INTERACTION (pan / zoom / drag / connect)
   ===================================================================== */
let drag=null;
vpEl.addEventListener("pointerdown",e=>{
  const handle=e.target.closest(".handle");
  const card=e.target.closest(".card");
  const hit=e.target.closest("path.hit");
  if(handle && card){
    e.preventDefault(); e.stopPropagation();
    drag={mode:"connect",sourceId:card.dataset.id};
    vpEl.classList.add("connecting"); $("#tempwire").style.display="";
    vpEl.setPointerCapture(e.pointerId); return;
  }
  if(card){
    if(e.target.closest(".act")||e.target.closest("button")) return;
    selectObject(card.dataset.id);
    const o=obj(card.dataset.id);
    drag={mode:"card",id:o.id,sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y,moved:false};
    vpEl.setPointerCapture(e.pointerId); return;
  }
  if(hit){ selectLink(hit.dataset.id); return; }
  // empty canvas → pan + deselect
  clearSelection();
  drag={mode:"pan",sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};
  vpEl.classList.add("panning"); vpEl.setPointerCapture(e.pointerId);
});
vpEl.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(drag.mode==="pan"){ pan.x=drag.px+(e.clientX-drag.sx); pan.y=drag.py+(e.clientY-drag.sy); applyTransform(); }
  else if(drag.mode==="card"){
    const o=obj(drag.id); if(!o) return;
    o.x=drag.ox+(e.clientX-drag.sx)/zoom; o.y=drag.oy+(e.clientY-drag.sy)/zoom;
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>3) drag.moved=true;
    const el=cardEls.get(o.id); if(el){ el.style.left=o.x+"px"; el.style.top=o.y+"px"; }
    renderLinks();
  }
  else if(drag.mode==="connect"){
    const src=obj(drag.sourceId); const sc=center(src);
    const w=screenToWorld(e.clientX,e.clientY);
    $("#tempwire").setAttribute("d","M"+sc.x+","+sc.y+" L"+w.x+","+w.y);
  }
});
vpEl.addEventListener("pointerup",e=>{
  if(!drag){ return; }
  if(drag.mode==="connect"){
    $("#tempwire").style.display="none"; $("#tempwire").removeAttribute("d");
    vpEl.classList.remove("connecting");
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tCard=el&&el.closest(".card");
    if(tCard&&tCard.dataset.id!==drag.sourceId){ openConnectionModal(drag.sourceId,tCard.dataset.id,null); }
  }
  if(drag.mode==="card"){ const o=obj(drag.id); if(o){o.updatedAt=now();} save(); }
  if(drag.mode==="pan"){ vpEl.classList.remove("panning"); state.viewport={x:pan.x,y:pan.y,zoom}; save(); }
  drag=null;
});

function fitView(){
  if(!state.objects.length) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.objects.forEach(o=>{ minX=Math.min(minX,o.x); minY=Math.min(minY,o.y); maxX=Math.max(maxX,o.x+(o.width||248)); maxY=Math.max(maxY,o.y+(o.height||120)); });
  const pad=80, bw=maxX-minX+pad*2, bh=maxY-minY+pad*2;
  const vw=vpEl.clientWidth, vh=vpEl.clientHeight;
  zoom=clamp(Math.min(vw/bw,vh/bh),0.25,1.6);
  pan.x=(vw-bw*zoom)/2 - (minX-pad)*zoom; pan.y=(vh-bh*zoom)/2 - (minY-pad)*zoom;
  applyTransform();
}
/* auto-arrange — grouped by COLOR CATEGORY, guaranteed non-overlapping */
const COLOR_BAND_ORDER = ["var(--red)","var(--amber)","var(--signal)","var(--lime)","var(--cyan)","var(--blue)","var(--purple)","var(--violet)","var(--slate)"];
function arrangeColorKey(o){ return accentOf(o); }   // group by the card's accent colour (types that share a colour cluster together)
function arrange(quiet){
  if(!state.objects.length){ renderAll(); if(typeof fitView==="function") fitView(); return 0; }
  renderAll();   // measure live card heights (o.height = offsetHeight) so variable-height cards never collide
  const groups={};
  state.objects.forEach(function(o){ const k=arrangeColorKey(o); (groups[k]=groups[k]||[]).push(o); });
  const keys=Object.keys(groups).sort(function(a,b){ var ia=COLOR_BAND_ORDER.indexOf(a), ib=COLOR_BAND_ORDER.indexOf(b); if(ia<0)ia=99; if(ib<0)ib=99; return (ia-ib)||(a<b?-1:1); });
  const X0=160, Y0=160, COLW=248, COL_GAP=72, ROW_GAP=34, BAND_GAP=64, MAX_COL_H=1500;
  let cx=X0;
  keys.forEach(function(k){
    const arr=groups[k].slice().sort(function(a,b){ var ta=TYPE_LIST.indexOf(a.type), tb=TYPE_LIST.indexOf(b.type); return (ta-tb)||(String(a.title)<String(b.title)?-1:1); });
    let colX=cx, cy=Y0;
    arr.forEach(function(o){
      const h=(o.height&&o.height>24)?o.height:120;
      if(cy>Y0 && (cy+h)>(Y0+MAX_COL_H)){ colX+=(COLW+COL_GAP); cy=Y0; }   // a tall colour band wraps into the next sub-column (still the same band)
      o.x=colX; o.y=cy; o.width=COLW; o.updatedAt=now();
      cy+=h+ROW_GAP;                                                        // stack by REAL height + gap -> no vertical overlap
    });
    cx=colX+COLW+COL_GAP+BAND_GAP;                                          // next colour band starts clear of this band's last sub-column
  });
  renderAll(); if(typeof fitView==="function") fitView();
  if(!quiet && typeof toast==="function") toast("Grouped by colour category","ok");
  return keys.length;
}
$("#btnArrange").onclick=arrange;

const mm=$("#mmcv"), mctx=mm.getContext("2d");
const mmPanel=$("#minimap");
function drawMinimap(){
  if(!mctx) return;                                   // no 2d context (headless/unsupported)
  if(!mmPanel.classList.contains("show")) return;     // hidden by default — don't draw
  if(!state||!state.objects.length){ mctx.clearRect(0,0,mm.width,mm.height); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.objects.forEach(o=>{ minX=Math.min(minX,o.x); minY=Math.min(minY,o.y); maxX=Math.max(maxX,o.x+248); maxY=Math.max(maxY,o.y+120); });
  const bw=maxX-minX||1, bh=maxY-minY||1, s=Math.min(mm.width/bw,mm.height/bh)*0.9;
  const ox=(mm.width-bw*s)/2-minX*s, oy=(mm.height-bh*s)/2-minY*s;
  mctx.clearRect(0,0,mm.width,mm.height);
  mctx.strokeStyle="rgba(150,170,200,.25)"; mctx.lineWidth=1;
  state.links.forEach(l=>{ const a=obj(l.sourceId),b=obj(l.targetId); if(!a||!b)return; mctx.beginPath(); mctx.moveTo((a.x+124)*s+ox,(a.y+50)*s+oy); mctx.lineTo((b.x+124)*s+ox,(b.y+50)*s+oy); mctx.stroke(); });
  state.objects.forEach(o=>{ mctx.fillStyle=cssVar(accentOf(o))||"#94A3B8"; mctx.fillRect(o.x*s+ox,o.y*s+oy,248*s,90*s); });
  // viewport rect
  const r=vpEl.getBoundingClientRect();
  const vx=(-pan.x/zoom), vy=(-pan.y/zoom), vw=r.width/zoom, vh=r.height/zoom;
  mctx.strokeStyle="rgba(74,222,128,.9)"; mctx.lineWidth=1.5;
  mctx.strokeRect(vx*s+ox,vy*s+oy,vw*s,vh*s);
}

/* =====================================================================
   COMMAND PARSER (voice + typed, same pipeline)
   ===================================================================== */
function setCmdStatus(msg,cls){ state.voice.lastCommandStatus=msg; const hud=$("#voiceHud"); hud.classList.add("show"); $("#vSt").className="st "+(cls||"idle"); $("#vSt").textContent=msg; clearTimeout(setCmdStatus._t); setCmdStatus._t=setTimeout(()=>hud.classList.remove("show"),4200); }
function setTranscript(t){ state.voice.lastTranscript=t; $("#vTr").textContent=t||"—"; $("#voiceHud").classList.add("show"); }
const TYPE_RE = TYPE_LIST.map(t=>t.toLowerCase()).join("|");

/* ---- wake phrase + natural-speech normalization ----
   Strips wake phrase, leading filler, trailing punctuation, collapses spaces.
   Preserves the ORIGINAL casing of the remaining command (so object titles stay intact).
   Returns { command, display, hadWake, onlyWake }. */
const WAKE_RE = /^\s*(?:(?:hey|ok|okay|yo)\s*,?\s*(?:sigma|stigma|signal|cigna|signo|sigmund|cygna|sigmar|signa|saga)|(?:hey\s*,?\s*)?sigma)\b[\s,:.!?]*/i;
const FILLER_RE = /^(?:please|can you|could you|would you|computer)\b[\s,]*/i;
// spoken punctuation words that may appear after the wake phrase or trailing a command
const SPOKEN_PUNCT = "(?:comma|periods?|full stop|question marks?|exclamation points?|exclamation marks?|colons?|semicolons?)";
const LEAD_PUNCT_RE  = new RegExp("^(?:"+SPOKEN_PUNCT+")\\b[\\s,]*","i");
const TRAIL_PUNCT_RE = new RegExp("[\\s,]*\\b"+SPOKEN_PUNCT+"\\b[\\s.,!?]*$","i");
function normalizeCommand(raw){
  let s=(raw||"").replace(/\s+/g," ").trim();
  // 1) wake phrase (leading only)
  let hadWake=false;
  const wm=s.match(WAKE_RE);
  if(wm){ hadWake=true; s=s.slice(wm[0].length); }
  // 2) leading filler words + leading spoken punctuation (e.g. "Hey Sigma comma create ...")
  let prev=null;
  while(s!==prev){ prev=s; s=s.replace(FILLER_RE,"").replace(LEAD_PUNCT_RE,""); }
  // 3) trailing spoken punctuation words (loop: "... Alpha period", "... Alpha question mark")
  prev=null;
  while(s!==prev){ prev=s; s=s.replace(TRAIL_PUNCT_RE,""); }
  // 4) trailing punctuation marks
  s=s.replace(/[\s.,!?;:]+$/,"");
  // 5) collapse + trim again (mid-title punctuation words are left untouched)
  s=s.replace(/\s+/g," ").trim();
  return { command:s, display:s, hadWake, onlyWake:(hadWake && s==="") };
}

/* map spoken / inflected relationship words to canonical REL_TYPES tokens.
   "__rev_blocks" is a sentinel meaning: reverse direction and use "blocks". */
const REL_SYN = {
  "support":"supports","supporting":"supports","supports":"supports",
  "contradict":"contradicts","contradicting":"contradicts","contradicts":"contradicts",
  "block":"blocks","blocking":"blocks","blocks":"blocks","blocked by":"__rev_blocks",
  "depends on":"depends_on","depend on":"depends_on","dependent on":"depends_on","depends_on":"depends_on",
  "governed by":"governed_by","governs":"governed_by","governed_by":"governed_by",
  "cause":"causes","causing":"causes","causes":"causes",
  "trigger":"triggers","triggering":"triggers","triggers":"triggers",
  "inform":"informs","informing":"informs","informs":"informs",
  "evidence":"evidences","evidencing":"evidences","evidences":"evidences",
  "review":"reviews","reviewing":"reviews","reviews":"reviews",
  "produce":"produces","producing":"produces","produces":"produces",
  "patch":"patches","patching":"patches","patches":"patches",
  "supersede":"supersedes","superseding":"supersedes","supersedes":"supersedes",
  "enable":"enables","enabling":"enables","enables":"enables",
  "mitigate":"mitigates","mitigating":"mitigates","mitigates":"mitigates",
  "assigned to":"assigned_to","assign to":"assigned_to","assigned_to":"assigned_to",
  "related to":"related_to","relates to":"related_to","related_to":"related_to"
};
function normalizeRel(s){
  if(s==null) return null;
  let r=String(s).trim().toLowerCase().replace(/[.,!?]+$/,"").replace(/\s+/g," ");
  if(!r) return null;
  if(REL_SYN[r]) return REL_SYN[r];
  r=r.replace(/\s+/g,"_");
  return r;
}

/* create an object from a (loosely-cased) type word + original-cased title */
function doCreate(typeWord,titleRaw){
  const type=TYPE_LIST.find(x=>x.toLowerCase()===String(typeWord).toLowerCase());
  if(!type){ setCmdStatus("Unknown object type \u201C"+typeWord+"\u201D","warn"); return false; }
  const title=String(titleRaw).trim();   // ORIGINAL casing preserved
  const center=screenToWorld(vpEl.getBoundingClientRect().left+vpEl.clientWidth/2,vpEl.getBoundingClientRect().top+vpEl.clientHeight/2);
  const n=newObject({type,title,x:center.x-124+(Math.random()*60-30),y:center.y-60+(Math.random()*60-30)});

function runCommand(raw, opts){
  opts=opts||{};
  const norm=normalizeCommand(raw);
  // Wake-phrase enforcement applies to VOICE only; typed commands never require it.
  if(opts.source==="voice" && state.voice && state.voice.wakeMode==="required" && !norm.hadWake){
    setCmdStatus("Say \u201CHey Sigma\u201D to issue a command","idle"); return false;
  }
  if(norm.onlyWake){ setCmdStatus("Sigma ready","ok"); return false; }
  const text=norm.command; if(!text){ if(norm.hadWake) setCmdStatus("Sigma ready","ok"); return false; }
  const t=text.toLowerCase();
  let m;
  // create — full form
  if(m=text.match(new RegExp("^create (?:a |an )?("+TYPE_RE+")(?: (?:called|named|titled))? (.+)$","i"))){
    return doCreate(m[1],m[2]);
  }
  // create — short form: "<type> called <title>"
  if(m=text.match(new RegExp("^("+TYPE_RE+")(?: (?:called|named|titled)) (.+)$","i"))){
    return doCreate(m[1],m[2]);
  }
  // connect/link A to B [as REL]
  if(m=text.match(/^(?:connect|link) (.+?) to (.+?)(?: as (.+))?$/i)){
    let a=findByTitle(m[1]), b=findByTitle(m[2]);
    if(!a){ setCmdStatus('No object matching "'+m[1].trim()+'"',"err"); return false; }
    if(!b){ setCmdStatus('No object matching "'+m[2].trim()+'"',"err"); return false; }
    let rel=normalizeRel(m[3]||null), reverse=false;
    if(rel==="__rev_blocks"){ rel="blocks"; reverse=true; }          // "A blocked by B" => B blocks A
    if(rel && !REL_TYPES.includes(rel)){ setCmdStatus('Unknown relationship "'+String(m[3]).trim()+'" — define it manually',"warn"); rel=null; }
    const src=reverse?b:a, tgt=reverse?a:b;
    if(rel){
      const st=REL_STYLE[rel]||{c:"#94A3B8",l:"solid"};
      const l={id:uid("LNK"),sourceId:src.id,targetId:tgt.id,type:rel,label:rel,description:"",direction:"directed",confidence:null,style:{lineStyle:st.l,color:st.c,thickness:st.t||1.8,arrow:true},createdAt:now(),updatedAt:now(),metadata:{}};
      state.links.push(l); renderAll(); selectLink(l.id); setCmdStatus("Linked: "+src.title+" "+rel+" "+tgt.title,"ok"); return true;
    } else { openConnectionModal(src.id,tgt.id,null); setCmdStatus("Define connection: "+src.title+" → "+tgt.title,"ok"); return true; }
  }
  // select
  if((m=text.match(/^(?:select|open|focus) (.+)$/i)) && !/^open inspector$/i.test(t)){
    const o=findByTitle(m[1]); if(o){ selectObject(o.id); jumpTo(o); setCmdStatus("Selected "+o.title,"ok"); return true; }
    setCmdStatus('No object matching "'+m[1].trim()+'"',"err"); return false;
  }
  // highlight TEXT in selected
  if(m=text.match(/^highlight (.+?) in selected$/i)){
    const o=obj(state.selectedObjectId); if(!o){ setCmdStatus("Nothing selected","warn"); return false; }
    o.visual.highlightRanges=o.visual.highlightRanges||[]; o.visual.highlightRanges.push({text:m[1].trim(),kind:"warn"}); renderAll(); selectObject(o.id);
    setCmdStatus('Highlighted "'+m[1].trim()+'"',"ok"); return true;
  }
  // search
  if(m=text.match(/^search (.+)$/i)){ $("#search").value=m[1].trim(); doSearch(m[1].trim()); setCmdStatus("Search: "+m[1].trim(),"ok"); return true; }
  // simple verbs
  if(/^open inspector$/i.test(t)){ openInspector(); setCmdStatus("Inspector open","ok"); return true; }
  if(/^(edit|edit selected)$/i.test(t)){ const o=obj(state.selectedObjectId); if(o){openObjectModal(o);setCmdStatus("Editing "+o.title,"ok");return true;} setCmdStatus("Nothing selected","warn"); return false; }
  if(/^(delete|delete selected)$/i.test(t)){ const o=obj(state.selectedObjectId),l=lnk(state.selectedLinkId);
    if(o){ confirmModal("Delete object?","Delete \""+o.title+"\"?",()=>deleteObject(o.id)); setCmdStatus("Confirm delete","warn"); return true; }
    if(l){ confirmModal("Delete connection?","Remove this relationship?",()=>{state.links=state.links.filter(x=>x.id!==l.id);clearSelection();renderAll();}); return true; }
    setCmdStatus("Nothing selected","warn"); return false; }
  if(/^(seal|seal selected)$/i.test(t)){ const o=obj(state.selectedObjectId); if(o){o.sealed=true;o.visual.borderStyle="double";o.updatedAt=now();renderAll();setCmdStatus("Sealed "+o.title,"ok");return true;} setCmdStatus("Nothing selected","warn");return false; }
  if(/^(patch|patch selected)$/i.test(t)){ const o=obj(state.selectedObjectId); if(o){openPatchModal(o);return true;} setCmdStatus("Nothing selected","warn");return false; }
  if(/^zoom in$/i.test(t)){ const r=vpEl.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1.2); setCmdStatus("Zoom in","ok"); return true; }
  if(/^zoom out$/i.test(t)){ const r=vpEl.getBoundingClientRect(); zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2); setCmdStatus("Zoom out","ok"); return true; }
  if(/^(fit|fit canvas|fit to view)$/i.test(t)){ fitView(); setCmdStatus("Fit to view","ok"); return true; }
  if(/^(arrange|arrange canvas|auto arrange)$/i.test(t)){ arrange(); setCmdStatus("Arranged","ok"); return true; }
  if(/^export(?: json)?$/i.test(t)){ exportJSON(); setCmdStatus("Exported","ok"); return true; }
  if(/^import(?: json)?$/i.test(t)){ openIOModal(); setCmdStatus("Import dialog","ok"); return true; }
  if(/^(show )?(voice )?help$/i.test(t)){ openHelpModal(); setCmdStatus("Help","ok"); return true; }
  if(/^(capture )?dlr$/i.test(t)){ openDLRModal(); return true; }
  if(/^reflect(ion)?$/i.test(t)){ openReflectionModal(); return true; }
  setCmdStatus('Command not understood: "'+norm.display+'"',"warn"); return false;
}

/* Map a status message to a SHORT spoken confirmation (<=8 words, never raw command text). */
function shortSpoken(msg,cls){
  const m=String(msg||"");
  if(/^Created\b/.test(m)) return "Created.";
  if(/^Linked\b/.test(m)) return "Linked.";
  if(/^Selected\b/.test(m)) return "Selected.";
  if(/^Sealed\b/.test(m)) return "Sealed.";
  if(/^Unsealed\b/.test(m)) return "Unsealed.";
  if(/^Sigma ready\b/.test(m)) return "Sigma ready.";
  if(/not understood/i.test(m)) return "Command not understood.";
  if(/^Define connection\b/i.test(m)) return "Choose relationship.";
  if(/^Search\b/i.test(m)) return "Searching.";
  if(/^No object matching/i.test(m)) return "No match.";
  if(cls==="err") return "Error.";
  if(cls==="warn") return null;
  const words=m.trim().split(/\s+/);
  return words.length<=8 ? m : null;
}

  let ctx=null; try{ ctx=cv.getContext("2d"); }catch(e){ ctx=null; } if(!ctx){ sigmaWaveRAF=null; return; }

    const N=sigmaMicData.length, step=N/w;
    for(let x=0;x<w;x++){ const v=(sigmaMicData[Math.floor(x*step)]-128)/128; const y=mid+v*(h*0.46); if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }

  else if(proto==="http:" && /^(localhost|127\.0\.0\.1)/.test(host)){ level="Acceptable"; advice="Localhost \u2014 fine for development. Mic permission is more stable than file://."; }
  else if(proto==="file:"){ level="Degraded"; advice="Local file (file://) \u2014 the browser may re-prompt for the mic and can block speech recognition. Host this single file on HTTPS (SharePoint / Teams) for stable always-on voice. If the mic loops, stop voice and reload. Typed commands remain fully available."; }
  else if(proto==="http:"){ level="Degraded"; advice="Insecure HTTP \u2014 microphone APIs may be unstable. Use HTTPS."; }

function sigmaResolveLinkTarget(q){

    const byTitle=sigmaSession.targetCandidates.find(o=>o.title.toLowerCase()===low || o.title.toLowerCase().includes(low));

  if(!cands.length){ sigmaSession.step="awaiting_link_target"; sigmaRespond("I couldn't find that. Which object?", sigmaOtherObjectChoices(sigmaSession.sourceObjectId,6)); sigmaSettle(); return; }

/* ---- session continuation (multi-turn memory) ---- */
function sigmaContinueSession(raw, cmd){
  const t=String(cmd||raw||"").trim(); const low=t.toLowerCase();
  if(/^(cancel|never mind|abort|stop|forget it)$/.test(low)){ sigmaResetSession(); sigmaClearChoices(); sigmaRespond("Cancelled.", sigmaContextActions()); sigmaSettle(); return; }
  const step=sigmaSession.step;
  if(step==="awaiting_type"){ const ty=sigmaTypeFromText(low) || (TYPE_LIST.find(x=>x.toLowerCase()===low)||null);
    if(!ty){ sigmaRespond("Which type? Pick one.", sigmaTypeChoices()); return; }
    sigmaSession.draft.type=ty; sigmaSession.step="awaiting_title"; sigmaClearChoices(); sigmaRespond("What should the "+ty+" be called?"); sigmaSettle(); return; }
  if(step==="awaiting_title"){ sigmaSession.draft.title=t.replace(/[.?!]+$/,""); sigmaClearChoices(); sigmaFinishCreate(); return; }
  if(step==="post_create_connect"){
    if(/^(yes|yeah|sure|connect|ok|okay|y)$/.test(low)){ sigmaSession.mode="linking_objects"; sigmaSession.step="awaiting_link_target";
      sigmaRespond("Connect \u201C"+sigmaObjTitle(sigmaSession.sourceObjectId)+"\u201D to which object?", sigmaOtherObjectChoices(sigmaSession.sourceObjectId,6)); sigmaSettle(); return; }
    if(/^(no|nope|done|cancel|nothing|skip|not now)$/.test(low)){ sigmaResetSession(); sigmaClearChoices(); sigmaRespond("Done.", sigmaContextActions()); sigmaSettle(); return; }
    sigmaResetSession(); sigmaClearChoices(); sigmaHandleUserInput(raw, {source:"resume"}); return; }   // a new command breaks out of the offer
  if(step==="awaiting_link_target" || step==="awaiting_target_choice"){ sigmaResolveLinkTarget(t); return; }
  if(step==="awaiting_relationship"){ const rel=sigmaResolveRel(low); if(!rel){ sigmaRespond("Which relationship? Pick one or name another.", sigmaRelChoices()); return; }
    sigmaSession.draft.rel=rel; sigmaClearChoices(); sigmaCommitLink(); return; }
  if(step==="post_event_action"){
    if(/^(yes|create action|action|yeah|sure|ok|y)$/.test(low)){ sigmaSession.mode="creating_object"; sigmaSession.intent="create_object"; sigmaSession.draft={type:"Action"}; sigmaSession.step="awaiting_title";
      sigmaClearChoices(); sigmaRespond("What should the action be called?"); sigmaSettle(); return; }
    if(/^(no|nope|done|cancel|nothing|skip|not now)$/.test(low)){ sigmaResetSession(); sigmaClearChoices(); sigmaRespond("Done.", sigmaContextActions()); sigmaSettle(); return; }
    sigmaResetSession(); sigmaClearChoices(); sigmaHandleUserInput(raw, {source:"resume"}); return; }
  // unknown step -> reset and re-handle fresh
  sigmaResetSession(); sigmaHandleUserInput(raw, {source:"resume"});
}

/* ---- canvas awareness ---- */

let sigmaExplainState={id:null,n:0};
function sigmaList(a){ a=(a||[]).filter(Boolean); if(!a.length) return ""; if(a.length>3){ const x=a.length-3; a=a.slice(0,3); a.push(x+" more"); }
  if(a.length===1) return a[0]; return a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }
function sigmaReachSet(id){ const seen={}; seen[id]=1; const q=[id]; let guard=0;   // directed downstream reach (the "could affect N" blast radius), incl. self
  while(q.length && guard++<5000){ const cur=q.shift(); state.links.forEach(function(l){ if(l.sourceId===cur && !seen[l.targetId]){ seen[l.targetId]=1; q.push(l.targetId); } }); }
  return seen; }
function sigmaReach(id){ return Object.keys(sigmaReachSet(id)).length-1; }
function sigmaShowConnections(){   // the selected object's DIRECT connections (in+out) — revealed even if the canvas is filtered to a subset
  const o=obj(state.selectedObjectId);
  if(!o){ sigmaRespond("Select an object first, then say show connections.", sigmaContextActions(), "Select an object first."); sigmaSettle(); return; }
  const ids=new Set([o.id]); let outs=0, ins=0;
  state.links.forEach(function(l){
    if(l.sourceId===o.id && obj(l.targetId)){ ids.add(l.targetId); outs++; }
    if(l.targetId===o.id && obj(l.sourceId)){ ids.add(l.sourceId); ins++; }
  });
  const n=ids.size-1;
  if(n<=0){ sigmaRespond("\u201C"+o.title+"\u201D has no connections yet \u2014 link it to another object.", sigmaContextActions(), "No connections yet."); sigmaSettle(); return; }
  sigmaFocusIds=ids; sigmaHitIds=new Set(); renderAll(); selectObject(o.id);   // override any category/subset filter to surface ALL its direct links
  if(typeof sigmaFitToObjects==="function") sigmaFitToObjects(Array.from(ids).map(obj).filter(Boolean));
  if(typeof sigmaCommitView==="function") sigmaCommitView();
  const parts=[]; if(outs) parts.push(outs+" outgoing"); if(ins) parts.push(ins+" incoming");
  sigmaRespond("\u201C"+o.title+"\u201D has "+n+" direct connection"+(n===1?"":"s")+(parts.length?(" ("+parts.join(", ")+")"):"")+".", sigmaFoundActions(), o.title+", "+n+" connection"+(n===1?"":"s")+".");

function sigmaConnectedSet(id){   // FULL connectivity \u2014 every object linked to id in EITHER direction, transitively
  const seen={}; seen[id]=1; const q=[id]; let g=0;
  while(q.length && g++<8000){ const cur=q.shift();
    state.links.forEach(function(l){
      if(l.sourceId===cur && !seen[l.targetId]){ seen[l.targetId]=1; q.push(l.targetId); }
      if(l.targetId===cur && !seen[l.sourceId]){ seen[l.sourceId]=1; q.push(l.sourceId); }

}
function sigmaShowConnected(){   // surface the objects behind "could affect N connected"
  const o=obj(state.selectedObjectId);
  if(!o){ sigmaRespond("Select an object first, then say show connected.", sigmaContextActions()); sigmaSettle(); return; }
  let ids=new Set(Object.keys(sigmaConnectedSet(o.id)).filter(function(id){ return !!obj(id); }));   // self + EVERYTHING connected (in/out, transitive)
  let n=ids.size-1;
  if(n<=0){ sigmaRespond("\u201C"+o.title+"\u201D has no connected objects yet \u2014 link it so its reach can be traced.", sigmaContextActions(), "No connections yet."); sigmaSettle(); return; }

    if(s&&s.key==="connect") return ['an object title','"skip"','"cancel"'];
    if(s&&s.key==="rel") return ['"informs"','"supports"','"triggers"','"skip"'];
    return ['"cancel"']; }
  if(sigmaVoiceState.pendingConfirmation) return ['"confirm"','"cancel"'];
  switch(sigmaSession.step){
    case "awaiting_type": return ['"claim"','"decision"','"risk"','"action"','"evidence"','"event"'];
    case "awaiting_title": return ['say the title, e.g. "Subject refused ID"','"cancel"'];
    case "post_create_connect": return ['"yes"','"no"'];
    case "awaiting_link_target": return ['an object title','a type, e.g. "the decision"'];
    case "awaiting_target_choice": return ['"one"','"two"','or say the title'];
    case "awaiting_relationship": return ['"supports"','"informs"','"contradicts"','"blocks"','"related to"'];
    case "post_event_action": return ['"create action"','"done"'];
  }
  const o=obj(state.selectedObjectId);
  if(o) return ['"why does this matter"','"connect this to the decision"','"what next"','"seal selected"'];
  if(!state.objects.length) return ['"create a claim"','"record event"','"what can I do"','"load demo"'];
  return ['"create a decision"','"what\u2019s on the canvas"','"what am I missing"','"select <title>"'];
}

function boot(){
  const saved=load();                                  // never delete prior saved work
  let offerChoice=false;
  if(saved && saved.objects && saved.objects.length){  // a real saved canvas exists
    sigmaSavedCanvas=saved; state=blankState(); offerChoice=true;   // open visually blank, but keep saved for one tap
  } else { state=saved||blankState(); }                // nothing saved -> blank start
  sigmaStartupOffer=offerChoice; sigmaHoldSave=offerChoice;   // do not let boot-time renderAll persist a blank over the saved canvas
  state.version=VERSION; state.mode="Canvas";
  // sanity: ensure visual fields
  state.objects.forEach(o=>{ o.visual=o.visual||{borderStyle:"solid",highlightRanges:[],pinned:false}; o.visual.highlightRanges=o.visual.highlightRanges||[]; o.tags=o.tags||[]; });
  pan={x:(state.viewport&&state.viewport.x)||80,y:(state.viewport&&state.viewport.y)||40};
  zoom=(state.viewport&&state.viewport.zoom)||0.62;
  applyTransform();
  renderAll();
  sigmaViewStack=[]; sigmaViewIdx=-1; if(typeof sigmaCommitView==="function") sigmaCommitView();   // seed canvas history at boot
  $("#verStamp").textContent="Canvas Mode · v"+VERSION+" "+RC;
  $("#footstamp").textContent="v"+VERSION+" "+RC+" · "+state.objects.length+" objects · SYNTHETIC / ILLUSTRATIVE DEMO";
  sigmaInitDock();                     // inject Sigma Voice Dock; chip mirrors dock state
  setTranscript(""); $("#voiceHud").classList.remove("show");
}
