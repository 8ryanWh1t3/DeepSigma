[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyAltCog"
version = "0.1.0"
description = "Deterministic Alternative Cognition operations library for Deep Sigma AltCogOps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Deep Sigma"}]
keywords = ["alternative-cognition", "decision-intelligence", "falsification", "governance", "deep-sigma"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
pyaltcog = "pyaltcog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyaltcog*"]

[tool.setuptools.package-data]
pyaltcog = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
